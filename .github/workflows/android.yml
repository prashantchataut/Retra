name: Build Retra

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: retra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (host tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Run engine test suite
        run: sh engine/host/run_tests.sh
      - name: Build Mochi Hop from source
        run: |
          sh game/build.sh
          cmp game/build/mochi_hop.gba app/src/main/assets/games/mochi_hop.gba \
            || echo "::notice::Rebuilt ROM differs from the committed one (different gcc version)"

  android:
    name: Android (tests + APKs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Unit tests
        run: ./gradlew --stacktrace :patcher:test :app:testDebugUnitTest
      - name: Prepare optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.RETRA_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RETRA_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RETRA_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RETRA_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release-signing secrets supplied; the release APK will use the debug key."
            exit 0
          fi
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "$(eval echo \"\$$v\")" ] || {
              echo "::error::Release signing is partially configured. Supply all four RETRA_SIGNING_* secrets or none."
              exit 1
            }
          done
          KEYSTORE="$RUNNER_TEMP/retra-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE" || { echo "::error::Decoded release keystore is empty."; exit 1; }
          echo "RETRA_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Assemble APKs
        env:
          RETRA_SIGNING_STORE_FILE: ${{ env.RETRA_RELEASE_KEYSTORE_PATH }}
          RETRA_SIGNING_STORE_PASSWORD: ${{ secrets.RETRA_SIGNING_STORE_PASSWORD }}
          RETRA_SIGNING_KEY_ALIAS: ${{ secrets.RETRA_SIGNING_KEY_ALIAS }}
          RETRA_SIGNING_KEY_PASSWORD: ${{ secrets.RETRA_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/Retra-${GITHUB_SHA::8}-debug.apk
          cp app/build/outputs/apk/release/*.apk out/Retra-${GITHUB_SHA::8}-release.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Retra-apks
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
