name: Build Retra

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: retra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (host tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Run engine test suite
        run: sh engine/host/run_tests.sh
      - name: Build Mochi Hop from source
        run: |
          sh game/build.sh
          cmp game/build/mochi_hop.gba app/src/main/assets/games/mochi_hop.gba \
            || echo "::notice::Rebuilt ROM differs from the committed one (different gcc version)"

  android:
    name: Android (tests + APKs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Unit tests
        run: ./gradlew --stacktrace :patcher:test :app:testDebugUnitTest
      - name: Assemble APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/Retra-${GITHUB_SHA::8}-debug.apk
          cp app/build/outputs/apk/release/*.apk out/Retra-${GITHUB_SHA::8}-release.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Retra-apks
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
